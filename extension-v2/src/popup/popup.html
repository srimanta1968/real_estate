<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>DealEval Pro</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; width: 320px; margin: 0; padding: 16px; color: #111827; }
  h1 { font-size: 15px; margin: 0 0 12px; color: #6366f1; }
  .section { margin-bottom: 14px; }
  label { display: block; font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  input[type=text] { width: 100%; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 6px; padding: 6px 8px; font-size: 13px; }
  button { background: #6366f1; color: white; border: 0; border-radius: 6px; padding: 6px 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
  button.secondary { background: #e5e7eb; color: #374151; }
  .row { display: flex; gap: 6px; }
  .status { font-size: 11px; padding: 6px 8px; border-radius: 4px; margin-top: 6px; }
  .status.ok { background: #ecfdf5; color: #047857; }
  .status.err { background: #fef2f2; color: #b91c1c; }
  .meta { font-size: 11px; color: #6b7280; margin-top: 6px; }
  .env-buttons { display: flex; gap: 4px; margin-top: 4px; }
  .env-buttons button { flex: 1; padding: 5px 0; font-size: 11px; }
  .env-buttons button.active { background: #6366f1; color: white; }
  .env-buttons button.inactive { background: #f3f4f6; color: #6b7280; }
</style>
</head>
<body>
  <h1>DealEval Pro — Config Mode</h1>
  <div class="section">
    <label>Config endpoint</label>
    <div class="env-buttons">
      <button id="envDev" class="inactive">Dev (localhost)</button>
      <button id="envProd" class="inactive">Prod</button>
    </div>
    <input type="text" id="configUrl" placeholder="https://..." />
    <div class="row" style="margin-top:6px;">
      <button id="saveBtn">Save</button>
      <button id="refreshBtn" class="secondary">Refresh config</button>
    </div>
    <div id="status" class="status" style="display:none;"></div>
    <div id="meta" class="meta"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
